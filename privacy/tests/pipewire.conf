context.properties = {
    core.daemon = true
    core.name = cutefish-privacy-test
    default.clock.rate = 48000
    default.clock.quantum = 256
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    video.convert.* = videoconvert/libspa-videoconvert
    support.* = support/libspa-support
    audiotestsrc = audiotestsrc/libspa-audiotestsrc
    videotestsrc = videotestsrc/libspa-videotestsrc
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-access }
]

context.objects = [
    { factory = spa-node-factory
        args = {
            factory.name = support.node.driver
            node.name = Test-Driver
            node.group = pipewire.dummy
            priority.driver = 20000
        }
    }
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = test-speaker
            node.virtual = true
            audio.rate = 48000
            audio.channels = 2
            node.description = "Test Speaker"
            media.class = Audio/Sink
            audio.position = [ FL FR ]
            object.linger = true
        }
    }
    { factory = adapter
        args = {
            factory.name = audiotestsrc
            node.name = test-microphone
            node.virtual = true
            audio.rate = 48000
            audio.channels = 2
            node.description = "Test Microphone"
            media.class = Audio/Source
            audio.position = [ FL FR ]
            object.linger = true
        }
    }
    { factory = spa-node-factory
        args = {
            factory.name = videotestsrc
            node.name = test-camera
            node.description = "Test Camera"
            media.class = Video/Source
            media.role = Camera
            object.linger = true
        }
    }
    { factory = spa-node-factory
        args = {
            factory.name = videotestsrc
            node.name = test-screen
            node.description = "Test Screen"
            media.class = Video/Source
            media.role = Screen
            object.linger = true
        }
    }
]
